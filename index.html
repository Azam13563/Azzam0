<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop Web - High Speed P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبات الربط والنقل -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; }
        .glass { background: rgba(28, 28, 30, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        #qrcode img { margin: 0 auto; border-radius: 12px; border: 8px solid white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="main-card" class="w-full max-w-md glass rounded-[2rem] p-8 shadow-2xl">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i data-lucide="zap" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">AirDrop Web</h1>
        </div>

        <!-- Start View -->
        <div id="view-start" class="space-y-4">
            <button onclick="startReceiver()" class="w-full flex items-center gap-4 p-5 rounded-2xl bg-[#1c1c1e] border border-white/10 hover:bg-white/5 transition-all">
                <i data-lucide="monitor-down" class="text-blue-500 w-8 h-8"></i>
                <div class="text-left">
                    <div class="font-bold">المستقبل (الكمبيوتر)</div>
                    <div class="text-sm text-gray-400">Receive File</div>
                </div>
            </button>
            <button onclick="startSender()" class="w-full flex items-center gap-4 p-5 rounded-2xl bg-[#1c1c1e] border border-white/10 hover:bg-white/5 transition-all">
                <i data-lucide="smartphone" class="text-green-500 w-8 h-8"></i>
                <div class="text-left">
                    <div class="font-bold">المرسل (الجوال)</div>
                    <div class="text-sm text-gray-400">Send File</div>
                </div>
            </button>
        </div>

        <!-- Receiver View (QR Code) -->
        <div id="view-receive" class="hidden text-center space-y-6">
            <div id="qr-container" class="bg-white p-4 inline-block rounded-3xl mx-auto">
                <div id="qrcode"></div>
                <div id="status-text" class="text-black text-xs mt-2 font-mono">جاري إنشاء الاتصال...</div>
            </div>
            <div>
                <h2 class="text-xl font-bold">جاهز للاستقبال</h2>
                <p class="text-gray-400 text-sm mt-2">امسح الكود من الجوال للبدء</p>
            </div>
            <div class="bg-black/50 p-3 rounded-xl border border-white/5 font-mono text-sm break-all" id="my-id">...</div>
        </div>

        <!-- Sender View (Connect) -->
        <div id="view-send" class="hidden space-y-4">
            <div id="conn-input-area" class="space-y-4">
                <input type="text" id="target-id" placeholder="أدخل رمز المستقبل هنا" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:outline-none focus:border-blue-500">
                <button onclick="connectToReceiver()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">اتصال</button>
            </div>
            
            <div id="drop-area" class="hidden border-2 border-dashed border-white/20 rounded-3xl p-10 text-center space-y-4">
                <i data-lucide="upload-cloud" class="w-12 h-12 mx-auto text-blue-500"></i>
                <p class="font-bold">تم الاتصال!</p>
                <input type="file" id="file-input" class="hidden" onchange="handleFile(this.files[0])">
                <button onclick="document.getElementById('file-input').click()" class="bg-white text-black px-6 py-2 rounded-full font-bold">اختر الفيديو</button>
            </div>
        </div>

        <!-- Progress View -->
        <div id="view-progress" class="hidden space-y-6 py-4">
            <div class="flex justify-between items-end">
                <div>
                    <div id="file-name" class="font-bold truncate w-40 text-blue-500">Video File</div>
                    <div id="file-size" class="text-xs text-gray-500">0 MB</div>
                </div>
                <div id="percent" class="text-3xl font-black">0%</div>
            </div>
            <div class="w-full bg-white/10 h-4 rounded-full overflow-hidden">
                <div id="bar" class="bg-blue-600 h-full w-0 transition-all"></div>
            </div>
            <div id="speed" class="text-center text-xs text-gray-400 font-mono">0 MB/s</div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let peer, conn, fileChunker;
        const CHUNK_SIZE = 16384 * 4; // 64KB chunks

        function showView(id) {
            ['view-start', 'view-receive', 'view-send', 'view-progress'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        // إعداد المستلم (الكمبيوتر)
        function startReceiver() {
            showView('view-receive');
            peer = new Peer();
            
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                document.getElementById('status-text').innerText = "ID: " + id;
                
                const joinUrl = window.location.origin + window.location.pathname + "?peer=" + id;
                new QRCode(document.getElementById("qrcode"), {
                    text: joinUrl,
                    width: 180,
                    height: 180
                });
            });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        // إعداد المرسل (الجوال)
        function startSender() {
            showView('view-send');
            peer = new Peer();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('peer')) {
                document.getElementById('target-id').value = urlParams.get('peer');
                setTimeout(connectToReceiver, 500);
            }
        }

        function connectToReceiver() {
            const targetId = document.getElementById('target-id').value;
            if (!targetId) return;
            conn = peer.connect(targetId, { reliable: true });
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                if (document.getElementById('view-send').classList.contains('hidden')) {
                    showView('view-progress');
                    document.getElementById('file-name').innerText = "في انتظار الملف...";
                } else {
                    document.getElementById('conn-input-area').classList.add('hidden');
                    document.getElementById('drop-area').classList.remove('hidden');
                }
            });

            let receivedChunks = [];
            let metadata = null;

            conn.on('data', (data) => {
                if (data.type === 'metadata') {
                    metadata = data;
                    receivedChunks = [];
                    showView('view-progress');
                    document.getElementById('file-name').innerText = data.name;
                    document.getElementById('file-size').innerText = (data.size / 1024 / 1024).toFixed(2) + " MB";
                } else if (data.type === 'done') {
                    const blob = new Blob(receivedChunks);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = metadata.name;
                    a.click();
                    alert("تم استلام الملف بنجاح!");
                    location.reload();
                } else {
                    receivedChunks.push(data);
                    let currentSize = receivedChunks.length * CHUNK_SIZE;
                    let p = Math.min(100, Math.round((currentSize / metadata.size) * 100));
                    document.getElementById('bar').style.width = p + '%';
                    document.getElementById('percent').innerText = p + '%';
                }
            });
        }

        function handleFile(file) {
            if (!file) return;
            showView('view-progress');
            document.getElementById('file-name').innerText = file.name;
            document.getElementById('file-size').innerText = (file.size / 1024 / 1024).toFixed(2) + " MB";

            conn.send({ type: 'metadata', name: file.name, size: file.size });

            let offset = 0;
            const reader = new FileReader();

            reader.onload = (e) => {
                conn.send(e.target.result);
                offset += e.target.result.byteLength;
                let p = Math.min(100, Math.round((offset / file.size) * 100));
                document.getElementById('bar').style.width = p + '%';
                document.getElementById('percent').innerText = p + '%';

                if (offset < file.size) {
                    readNext();
                } else {
                    setTimeout(() => {
                        conn.send({ type: 'done' });
                        alert("تم الإرسال بنجاح!");
                        location.reload();
                    }, 500);
                }
            };

            function readNext() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }
            readNext();
        }
    </script>
</body>
</html>
