<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناقل الملفات المستقر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; font-family: system-ui, sans-serif; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 20px; }
        .hidden { display: none !important; }
        #qrcode img { margin: 0 auto; padding: 10px; background: white; border-radius: 12px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md card p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-500">AirDrop Web Stable</h1>
            <p class="text-gray-500 text-sm">نقل الملفات بجودة أصلية</p>
        </div>

        <!-- الخطوة 1 -->
        <div id="view-step1" class="space-y-4 text-center">
            <button onclick="initPC()" class="w-full p-4 bg-blue-600 rounded-xl font-bold">هذا هو الكمبيوتر (المستقبل)</button>
            <button onclick="initMobile()" class="w-full p-4 bg-zinc-800 rounded-xl font-bold">هذا هو التابلت/الجوال (المرسل)</button>
        </div>

        <!-- شاشة المستقبل -->
        <div id="view-pc" class="hidden text-center space-y-6">
            <div id="qrcode" class="flex justify-center min-h-[180px]"></div>
            <div class="p-3 bg-black/20 rounded-lg border border-white/5">
                <p class="text-xs text-gray-500">الرمز الخاص بك:</p>
                <p id="pc-id" class="font-mono text-lg text-blue-400">جاري التحميل...</p>
            </div>
            <div id="pc-status" class="text-sm text-yellow-500 animate-pulse">في انتظار الاتصال...</div>
            <div id="download-zone" class="hidden p-4 bg-green-900/20 border border-green-500/50 rounded-xl">
                <p class="text-green-400 mb-2">تم استلام الملف!</p>
                <a id="download-link" class="block w-full py-2 bg-green-600 rounded-lg font-bold">اضغط هنا للحفظ</a>
            </div>
        </div>

        <!-- شاشة المرسل -->
        <div id="view-mobile" class="hidden space-y-4 text-center">
            <input type="text" id="target-id" placeholder="أدخل رمز الكمبيوتر هنا" class="w-full p-4 bg-zinc-900 border border-zinc-700 rounded-xl text-center">
            <button id="connect-btn" onclick="connectToPC()" class="w-full p-4 bg-blue-600 rounded-xl font-bold">اتصال</button>
            
            <div id="send-zone" class="hidden py-8 border-2 border-dashed border-zinc-700 rounded-xl">
                <p class="text-green-500 mb-4 font-bold">متصل بالكمبيوتر ✅</p>
                <input type="file" id="file-input" class="hidden" onchange="startSending(this.files[0])">
                <button onclick="document.getElementById('file-input').click()" class="px-8 py-3 bg-white text-black rounded-full font-bold">اختر المقطع</button>
            </div>
        </div>

        <!-- شاشة التقدم -->
        <div id="view-progress" class="hidden space-y-4">
            <div class="flex justify-between font-bold">
                <span id="prog-label">جاري النقل...</span>
                <span id="prog-percent">0%</span>
            </div>
            <div class="w-full bg-zinc-800 h-4 rounded-full overflow-hidden">
                <div id="prog-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
            </div>
        </div>
    </div>

    <script>
        let peer, conn, receivedChunks = [], meta = null;
        const CHUNK_SIZE = 16384 * 2; // 32KB

        function show(id) {
            ['view-step1', 'view-pc', 'view-mobile', 'view-progress'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function initPC() {
            show('view-pc');
            peer = new Peer();
            peer.on('open', id => {
                document.getElementById('pc-id').innerText = id;
                new QRCode(document.getElementById("qrcode"), { text: window.location.href + "?id=" + id, width: 180, height: 180 });
            });
            peer.on('connection', c => {
                conn = c;
                document.getElementById('pc-status').innerText = "متصل بالمرسل، في انتظار الملف...";
                setupConn();
            });
        }

        function initMobile() {
            show('view-mobile');
            peer = new Peer();
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.has('id')) {
                document.getElementById('target-id').value = urlParams.get('id');
                setTimeout(connectToPC, 1000);
            }
        }

        function connectToPC() {
            const id = document.getElementById('target-id').value;
            if(!id) return;
            conn = peer.connect(id, { reliable: true });
            setupConn();
        }

        function setupConn() {
            conn.on('open', () => {
                if(document.getElementById('view-mobile').classList.contains('hidden') === false) {
                    document.getElementById('connect-btn').classList.add('hidden');
                    document.getElementById('send-zone').classList.remove('hidden');
                }
            });

            conn.on('data', data => {
                if(data.type === 'start') {
                    meta = data;
                    receivedChunks = [];
                    show('view-progress');
                    document.getElementById('prog-label').innerText = "يتم الاستقبال...";
                } else if (data.type === 'end') {
                    const blob = new Blob(receivedChunks);
                    const url = URL.createObjectURL(blob);
                    show('view-pc');
                    document.getElementById('pc-status').innerText = "اكتمل الاستلام!";
                    document.getElementById('download-zone').classList.remove('hidden');
                    const dl = document.getElementById('download-link');
                    dl.href = url;
                    dl.download = meta.name;
                    // محاولة تحميل تلقائي
                    dl.click();
                } else {
                    receivedChunks.push(data);
                    let p = Math.min(100, Math.round((receivedChunks.length * CHUNK_SIZE / meta.size) * 100));
                    document.getElementById('prog-bar').style.width = p + '%';
                    document.getElementById('prog-percent').innerText = p + '%';
                }
            });
        }

        function startSending(file) {
            if(!file) return;
            show('view-progress');
            document.getElementById('prog-label').innerText = "يتم الإرسال الآن...";
            conn.send({ type: 'start', name: file.name, size: file.size });

            let offset = 0;
            const reader = new FileReader();
            reader.onload = e => {
                conn.send(e.target.result);
                offset += e.target.result.byteLength;
                let p = Math.min(100, Math.round((offset / file.size) * 100));
                document.getElementById('prog-bar').style.width = p + '%';
                document.getElementById('prog-percent').innerText = p + '%';
                if(offset < file.size) readNext();
                else { conn.send({ type: 'end' }); alert("تم إرسال الملف بالكامل!"); location.reload(); }
            };

            function readNext() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }
            readNext();
        }
    </script>
</body>
</html>
